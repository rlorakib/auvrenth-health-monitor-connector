name: Connector release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable ZIP
        shell: pwsh
        run: ./scripts/build-release.ps1 -ExpectedVersion ($env:GITHUB_REF_NAME.Substring(1))
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/auvrenth-health-monitor-connector.zip --title "Health Monitor Connector $GITHUB_REF_NAME" --generate-notes
